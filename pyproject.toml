[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hnasko-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for Hnasko Lab"
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
  "neuroconv @ git+https://github.com/catalystneuro/neuroconv.git@2ea9985805b36e0738a6f823585c2a8ed69272b2",
  "nwbinspector",
  "ndx-fiber-photometry==0.2.4",
  "ndx-ophys-devices==0.3.1",
  "ndx-optogenetics==0.4.1",
  "openpyxl",
  "opencv-python-headless",
  "tdt",
  "dandi>=0.60",
  "remfile",
  "h5py",
  "numpy",
  "pandas",
  "pydantic",
  "pytz",
  "tqdm",
]

[project.scripts]
hadjas-2025 = "hnasko_lab_to_nwb.hadjas_2025.cli:main"

[project.optional-dependencies]
analysis = [
  "ipykernel",
  "matplotlib",
  "scipy",
  "statsmodels",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hnasko_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the hadjas_2025 modules only, not to its notebooks
"!src/hnasko_lab_to_nwb/hadjas_2025/**" = ["D"]
"*.ipynb" = ["D"]

[project.urls]
Repository="https://github.com/catalystneuro/hnasko-lab-to-nwb"

[tool.codespell]
ignore-regex = '"image/png": ".*"'

[tool.pytest.ini_options]
testpaths = ["tests"]
