# Ontology terms shared by all Hadjas 2025 cohorts, written into the file as HERD references. Each map is keyed by the
# exact value it annotates (Subject.species, Subject.strain, a location string, an experimenter name, or the institution).
ExternalResources:
  experimenter:
    Hadjas, Lotfi:
      id: orcid:0000-0003-1605-3601
      uri: https://orcid.org/0000-0003-1605-3601
    Hollon, Nick:
      id: orcid:0000-0003-4827-1582
      uri: https://orcid.org/0000-0003-4827-1582
  institution:
    UC San Diego School of Medicine:  # ROR has no record for the school, so this is the university
      id: ror:0168r3w48
      uri: https://ror.org/0168r3w48
  species:
    Mus musculus:
      id: NCBITaxon:10090
      uri: http://purl.obolibrary.org/obo/NCBITaxon_10090
  strain:
    C57BL/6J:  # the background all transgenic lines were backcrossed onto
      id: RRID:IMSR_JAX:000664
      uri: https://scicrunch.org/resolver/RRID:IMSR_JAX:000664
  # Allen Mouse Brain Atlas (MBA) and UBERON terms for the fiber, injection and recording locations
  anatomical_structures:
    substantia nigra pars compacta (SNc):
      - id: MBA:374
        uri: https://purl.brain-bican.org/ontology/mbao/MBA_374
      - id: UBERON:0001965
        uri: http://purl.obolibrary.org/obo/UBERON_0001965
    substantia nigra pars reticulata (SNr):
      - id: MBA:381
        uri: https://purl.brain-bican.org/ontology/mbao/MBA_381
      - id: UBERON:0001966
        uri: http://purl.obolibrary.org/obo/UBERON_0001966
    subthalamic nucleus (STN):
      - id: MBA:470
        uri: https://purl.brain-bican.org/ontology/mbao/MBA_470
      - id: UBERON:0001906
        uri: http://purl.obolibrary.org/obo/UBERON_0001906
    pedunculopontine nucleus (PPN):
      - id: MBA:1052
        uri: https://purl.brain-bican.org/ontology/mbao/MBA_1052
      - id: UBERON:0002142
        uri: http://purl.obolibrary.org/obo/UBERON_0002142
    # The Allen atlas has no DLS or TS subdivision: both get caudoputamen (CP) and the UBERON dorsal striatum, and the
    # location string keeps the subregion
    dorsolateral striatum (DLS):
      - id: MBA:672
        uri: https://purl.brain-bican.org/ontology/mbao/MBA_672
      - id: UBERON:0005382
        uri: http://purl.obolibrary.org/obo/UBERON_0005382
    tail of the striatum (TS):
