# Metadata for Hadjas 2025 --> Striatal DA terminal GCaMP6f recordings, STN stim
NWBFile:
  keywords: [DLS fiber photometry recordings, TS fiber photometry recordings, dopaminergic axon terminals, VGLUT2-Cre x DAT-Flp,
    STN optogenetic stimulation, PPN optogenetic stimulation, Parkinson's disease]
  experiment_description: Dopaminergic axon terminals recordings. Mice were freely moving on a plastic tub. Simultaneous passive
    optogenetic stimulation and fiber photometry recordings were conducted during the first two days. Excitatory inputs from
    either the STN or PPN to SN were stimulated. Recordings of GCaMP6f fluorescence signal captured striatal DA terminal activity
    in VGLUT2-Cre x DAT-Flp mice.
  surgery: Mice > 6 weeks old were anesthetized with isofluorane (4% for induction and 1-2% for maintenance), and provided
    with pre- and post-surgical analgesic carprofen (5 mg/kg i.p). For calcium recordings of striatal DA terminals in VGLUT2-Cre
    x DAT-Flp mice were injected with 300 nl of AAV1-Ef1a-fDIO-GCaMP6f (4e12 vg/mL, Addgene 1283125) in either DLS (AP +0.5,
    ML +/-2.25, DV -2.95) or TS (AP -1.25, ML +/-2.9, DV -3.45). A fiber (200-um core, 0.39 NA, L = 6 mm, 1.25-mm white ceramic
    ferrule, RWD) was implanted in DLS (AP +0.5, ML +/- 2.25, DV -2.75) or TS (AP -1.25, ML +/2.9, DV -3.25). For optogenetic
    stimulation, 150-200 nl of AAV5-Syn-FLEX-ChrimsonR-tdTomato (4 - 8.5e12 vg/ml, Addgene 62723) was injected in STN (AP
    -2.00, ML +/-1.6, DV -4.5).
