# Metadata for Hadjas 2025 --> Striatal DA terminal GCaMP6f recordings, STN stim
NWBFile:
  keywords: [DLS fiber photometry recordings, TS fiber photometry recordings, dopaminergic axon terminals, VGLUT2-Cre x DAT-Flp,
    STN optogenetic stimulation, Parkinson's disease]
  experiment_description: Activity of dopamine axon terminals in the dorsolateral striatum (DLS) or the tail of the
    striatum (TS) during optogenetic stimulation of subthalamic nucleus (STN) inputs to the substantia nigra (SN). In
    VGLUT2-Cre x DAT-Flp mice, GCaMP6f was expressed in dopamine neurons and ChrimsonR in STN glutamatergic neurons.
    Light was delivered through a separate fiber over SNc. Freely moving mice in a plastic tub received trains of 635
    nm laser pulses delivered to the input's terminals in SN while fluorescence was recorded. Each session follows one of two protocols, varying train durations or varying pulse
    frequencies, described in the session description.
  surgery: Mice > 6 weeks old were anesthetized with isofluorane (4% for induction and 1-2% for maintenance), and provided
    with pre- and post-surgical analgesic carprofen (5 mg/kg i.p). For calcium recordings of striatal DA terminals in VGLUT2-Cre
    x DAT-Flp mice were injected with 300 nl of AAV1-Ef1a-fDIO-GCaMP6f (4e12 vg/mL, Addgene 128315) in either DLS (AP +0.5,
    ML +/-2.25, DV -2.95) or TS (AP -1.25, ML +/-2.9, DV -3.45). A fiber (200-um core, 0.39 NA, L = 6 mm, 1.25-mm white ceramic
    ferrule, RWD) was implanted in SNc (AP -3.2, ML +/-1.4, DV -4.1) for optogenetic stimulation, and a second fiber (400-um
    core, 0.39 NA, L = 4 mm, 1.25-mm black ceramic ferrule, RWD) was implanted in DLS (AP +0.5, ML +/-2.25, DV -2.75) or TS
    (AP -1.25, ML +/-2.9, DV -3.25). For optogenetic
    stimulation, 150-200 nl of AAV5-Syn-FLEX-ChrimsonR-tdTomato (4 - 8.5e12 vg/ml, Addgene 62723) was injected in STN (AP
    -2.00, ML +/-1.6, DV -4.5).
Subject:
  description: All mouse experiments were performed in accordance with protocols approved by UCSD Institutional Animal
    Care and Use Committee. Male and female mice were bred at UCSD and group-housed on a 12-hour light/dark cycle,
    with food and water ad libitum. VGLUT2-Cre (Slc17a6tm2(cre)Lowl, RRID:IMSR_JAX:016963) mice were obtained from the
    Jackson Laboratory and maintained backcrossed on to C57BL/6J (RRID:IMSR_JAX:000664). DAT-Flp mice were provided by
    Dr. Helen Bateup (UC Berkeley; Slc6a3em1(flpo)Hbat, RRID:IMSR_JAX:035436) or by Dr. Rajeshwar Awatramani
    (Northwestern). Mice were VGLUT2-Cre x DAT-Flp.
  genotype: VGLUT2-Cre x DAT-Flp
