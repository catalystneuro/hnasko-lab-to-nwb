# Settings that differ between cohorts, protocols and subjects of the Hadjas 2025 dataset.
# Data streams written to every session; set one to false to skip it. A raw-only conversion (processed: false)
# needs only the TDT blocks, not the lab's .mat file. Optogenetic epochs are always written.
# processed: lab writes the demodulated, downsampled and dF/F signals of the lab's .mat file; recomputed computes
# them from the raw signal with hadjas_2025.processing (needs raw: true; see its module docstring for how they
# differ from the lab's). A cohort can set its own processed value (e.g. recomputed for a cohort without a lab .mat
# file); it applies unless processed is false.
data_streams:
  raw: true  # Fi1r photodetector signal of the TDT blocks
  processed: lab  # lab, recomputed or false
  behavioral_video: false  # AnyMaze videos of the cohorts' behavioral_video_inputs, not part of the Hadjas 2025 paper
# Each cohort key is the recording type of its metadata file (<recording type>_metadata.yaml). inputs lists the
# stimulated inputs converted (Input column of the sheet, and the input folder under data_folder). A cohort with a
# base_cohort has a metadata file that only gives what differs from the base cohort's file. mat_input_folder is the
# input folder whose protocol folders hold the cohort's lab .mat files, when it is not the session's own.
cohorts:
  SN pan GABA recordings:
    sheet_name: SNr GABA  # sheet of ASAP FP Overview.xlsx
    data_folder: SN pan GABA recordings
    inputs: [PPN, STN]
    behavioral_video_inputs: [PPN]  # AnyMaze videos, aligned to the TDT clock
  SN pan DA recordings:
    sheet_name: SNc pan-DA
    data_folder: SN pan DA recordings
    inputs: [PPN, STN]
  GRABDA recordings:
    sheet_name: GRAB DA
    data_folder: GRABDA recordings
    inputs: [PPN, STN]
  GRABDA recordings_STN_mCherry:
    sheet_name: GRAB DA
    data_folder: GRABDA recordings
    base_cohort: GRABDA recordings
    mat_input_folder: STN  # the STN .mat files hold the controls as sites DLS_ctrl and TS_ctrl
    inputs: [STN_mCherry]
  Str_DA_terminal recordings:
    sheet_name: Striatal DA terminals
    data_folder: Str_DA_terminal recordings
    inputs: [STN]
  Cell_type recordings_Vglut2:
    sheet_name: DA subtypes
    data_folder: Cell_type recordings
    genotype: DAT-flp  # rows of the sheet whose genotype contains this (VGlut2-cre X DAT-flp)
    subgroup_folder_prefix: Vglut2  # protocol subfolders are named "<prefix> <recording site>"; the site is taken from them
    inputs: [PPN, STN]
  Cell_type recordings_Anxa1:
    sheet_name: DA subtypes
    data_folder: Cell_type recordings
    genotype: Anxa1
    subgroup_folder_prefix: Anxa1
    site_in_session_id: true  # Anxa1 mice are recorded in SNc, DLS or both, one session per site
    inputs: [PPN, STN]
# Recording rigs, identified by the sampling frequency of the raw Fi1r stream of each TDT block.
# 24 kHz blocks have three Fi1r channels; only channel 2 carries the photodetector signal.
# Rig names follow the lab's hardware list and are to be confirmed per block with the lab.
rigs:
  RZ10x:
    fi1r_sampling_frequency: 6103.515625
    fi1r_signal_channel: null  # one channel
  RZ5P:
    fi1r_sampling_frequency: 24414.0625
    fi1r_signal_channel: 2
# Modulation frequency of the excitation LEDs, in Hz, for blocks recorded from first_recording_date on (lab MATLAB
# code). Blocks recorded before 2024 (the RZ5P blocks and the 2023 RZ10x blocks of C2450 and C2454) have the 465 nm
# LED at 210 Hz and the isosbestic LED at 330 Hz; blocks from 2024 on have them the other way round. The rig is not
# visible in the blocks of new recordings (FP1 and FP3 are both RZ10x), so check the carriers with the lab and add
# an entry when they change.
led_modulation:
  - first_recording_date: 2022-01-01
    calcium_signal_in_hz: 210.0
    isosbestic_control_in_hz: 330.0
  - first_recording_date: 2024-01-01
    calcium_signal_in_hz: 330.0
    isosbestic_control_in_hz: 210.0
# Protocols, keyed by the protocol folder name. Stimulation trains are TDT epocs; each epoc name maps to the
# pulse frequency of its trains. Some blocks name the duration stores ssm_, ss1_ and ss4_; the 24 kHz rig
# names them Sms_, S1s_, S4s_ and S6s_.
protocols:
  Varying durations:
    session_id: varying_durations
    session_description: "The mouse is placed in a plastic tub and receives 40 Hz optogenetic stimulation trains of 250 ms,
      1 s and 4 s, in this order, repeated 5 times, with 10 s between the end of one train and the start of the next. The
      optogenetic epochs table lists every train."
    session_description_by_epoc:  # replaces session_description for blocks with this epoc (2022 recordings)
      S6s_: "The mouse is placed in a plastic tub and receives 40 Hz optogenetic stimulation trains of 250 ms, 1 s, 4 s and
        16 s, in this order, repeated 5 or 10 times depending on the cohort, with 10 s between the end of one train and the
        start of the next. The 16 s trains come from the earliest cohorts and were not analyzed in the paper. The
        optogenetic epochs table lists every train."
    epoc_name_to_frequency_in_hz:
      sms_: 40.0
      s1s_: 40.0
      s4s_: 40.0
      ssm_: 40.0
      ss1_: 40.0
      ss4_: 40.0
      S1s_: 40.0
      S4s_: 40.0
      S6s_: 40.0
      Sms_: 40.0
  Varying frequencies:
    session_id: varying_frequencies
    session_description: "The session has one recording block per train duration (250 ms, 1 s and 4 s), in recording
      order; the order of the durations, ascending or descending, was counterbalanced across mice. In each block the mouse
      is placed in a plastic tub and receives optogenetic stimulation trains at 5, 10, 20 and 40 Hz, in this order,
      repeated 5 times (10 times in some 2022 recordings), with 20 s between the end of one train and the start of the
      next. The trials table has one trial per block and the optogenetic epochs table lists every train."
    session_description_single_block:  # replaces session_description for sessions recorded in one block (SN pan GABA, PPN)
      "The session is recorded in one block. The mouse is placed in a plastic tub and receives optogenetic stimulation
      trains of 250 ms, then 1 s, then 4 s. For each train duration, trains at 5, 10, 20 and 40 Hz, in this order, are
      repeated 5 times, with 20 s between the end of one train and the start of the next. The trials table has one trial
      per train duration and the optogenetic epochs table lists every train."
    epoc_name_to_frequency_in_hz:
      H10_: 10.0
      H20_: 20.0
      H40_: 40.0
      H05_: 5.0
      HH5_: 5.0  # name of the 5 Hz store in the frequencies blocks of C3412, C3798 and C4707 (Vglut2, PPN)
# Per-subject exceptions. mat_cohort_folder is the data folder of the cohort whose .mat file holds the subject's
# processed signals, when it is not the subject's own.
subjects:
  # The processed signals of the 2022 SN pan DA STN subjects are in the SN pan GABA STN .mat files (site SNc).
  B8364: {mat_cohort_folder: SN pan GABA recordings}
  B8369: {mat_cohort_folder: SN pan GABA recordings}
  B8370: {mat_cohort_folder: SN pan GABA recordings}
  B8427: {mat_cohort_folder: SN pan GABA recordings}
  B8429: {mat_cohort_folder: SN pan GABA recordings}
  B8612: {mat_cohort_folder: SN pan GABA recordings}
