      description: Viral injection into the Subthalamic Nucleus (STN).
      viral_vector: viral_vector_ogen
      location: STN
      hemisphere: right
      reference: bregma at the cortical surface
      ap_in_mm: -2.00
      ml_in_mm: 1.6
      dv_in_mm: -4.5
      volume_in_uL: 0.150
