        excitation_source_metadata_key: optogenetic_excitation_source
        optical_fiber_metadata_key: optical_fiber_SNc
        effector_metadata_key: chrimsonR_STN
      PPN:
        excitation_source_metadata_key: optogenetic_excitation_source
        optical_fiber_metadata_key: optical_fiber_SNc
        effector_metadata_key: chrimsonR_PPN
  OptogeneticEpochsTable:
    name: optogenetic_epochs_table
    description: One row per optogenetic stimulation train, from the train onset and offset events stored by TDT Synapse.
      The pulse width was not recorded, so pulse_length_in_ms is NaN.
