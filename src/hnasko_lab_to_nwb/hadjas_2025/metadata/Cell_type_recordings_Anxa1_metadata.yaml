# Metadata for Hadjas 2025 --> Parkinson's-vulnerable Anxa1+ dopamine subtypes, STN & PPN stim
NWBFile:
  keywords: [SNc fiber photometry recordings, DLS fiber photometry recordings, Anxa1+ dopamine subtypes, VGLUT2-PhiC31 x Anxa1-Cre,
    STN optogenetic stimulation, PPN optogenetic stimulation, Parkinson's disease]
  experiment_description: Activity of Anxa1+ dopamine neurons in SNc and of their axon terminals in the dorsolateral
    striatum (DLS) during optogenetic stimulation of excitatory inputs to the substantia nigra (SN). In VGLUT2-PhiC31
    x Anxa1-Cre mice, GCaMP8f was expressed in Anxa1+ neurons and a PhiC31-dependent ChrimsonR in glutamatergic
    neurons of either the subthalamic nucleus (STN) or the pedunculopontine nucleus (PPN). Fibers were implanted in
    SNc and DLS, and each recording site is a separate session. Light was delivered through the SNc fiber. Freely
    moving mice in a plastic tub received trains of 635 nm laser pulses delivered to the input's terminals in SN while
    fluorescence was recorded. Each session follows one of two protocols, varying train durations or varying pulse
    frequencies, described in the session description.
  surgery: Mice > 6 weeks old were anesthetized with isofluorane (4% for induction and 1-2% for maintenance), and provided
    with pre- and post-surgical analgesic carprofen (5 mg/kg i.p). For recording from Anxa1+ neurons and terminals projecting
    to DLS, VGLUT2-PhiC x Anxa1-Cre mice were injected with 150-200 nl of AAVDJ-Ef1a-pSIO-ChrimsonR-tdTomato (1e13 vg/ml,
    Vectorbuilder) in STN or PPN at the same coordinates as above. And injected with 300 nl of AAV5-Syn-FLEX-GCaMP8f (1e13
    vg/ml, Addgene 162379) in SNc (AP -3.20, ML +/-1.30, DV -4.30). Optic fibers were implanted in both SNc and DLS (400-um
    core, 0.39 NA, L = 6 or 4 mm, 1.25-mm black ceramic ferrule, RWD).
Subject:
  description: All mouse experiments were performed in accordance with protocols approved by UCSD Institutional Animal
    Care and Use Committee. Male and female mice were bred at UCSD and group-housed on a 12-hour light/dark cycle,
    with food and water ad libitum. VGLUT2-PhiC31 mice (Jeong et al. 2024) were provided by Dr. Byung Kook Lim (UC San
    Diego) and Anxa1-Cre mice (RRID:MMRRC_069931-MU) by Dr. Rajeshwar Awatramani (Northwestern). Mice were
    VGLUT2-PhiC31 x Anxa1-Cre.
  genotype: VGLUT2-PhiC31 x Anxa1-Cre
