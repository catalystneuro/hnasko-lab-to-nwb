Optogenetics:
  stimulation_software: TDT Synapse
  excitation_wavelength_in_nm: 635.0
  power_in_mW: 5.0
  OptogeneticViruses:
    viral_vector_ogen:
      name: viral_vector_ogen
      description: AAVDJ-Ef1a-pSIO-ChrimsonR-tdTomato (1e13 vg/ml, Vectorbuilder) viral vector was used for optogenetic experiments.
      manufacturer: Vectorbuilder
      construct_name: AAVDJ-Ef1a-pSIO-ChrimsonR-tdTomato
      titer_in_vg_per_ml: 1.0e+13
  OptogeneticVirusInjections:
    viral_vector_injection_STN:
      name: viral_vector_injection_STN
      description: Viral injection into the Subthalamic Nucleus (STN). The injected volume was 150 to 200 nl across mice;
        volume_in_uL is the upper bound.
      location: subthalamic nucleus (STN)
      hemisphere: right
      reference: bregma at the cortical surface
      ap_in_mm: -2.0
      ml_in_mm: 1.6
      dv_in_mm: -4.5
      volume_in_uL: 0.2
      viral_vector_metadata_key: viral_vector_ogen
    viral_vector_injection_PPN:
      name: viral_vector_injection_PPN
      description: Viral injection into the Pedunculopontine Nucleus (PPN). The injected volume was 150 to 200 nl across mice;
        volume_in_uL is the upper bound.
      location: pedunculopontine nucleus (PPN)
      hemisphere: right
      reference: bregma at the cortical surface
      ap_in_mm: -4.48
      ml_in_mm: 1.1
      dv_in_mm: -3.75
      volume_in_uL: 0.2
      viral_vector_metadata_key: viral_vector_ogen
  OptogeneticEffectors:
    chrimsonR_STN:
      name: chrimsonR_STN
      description: ChrimsonR opsin used for optogenetic stimulation injected into the STN.
      manufacturer: Addgene
      label: ChrimsonR-tdTomato
      viral_vector_injection_metadata_key: viral_vector_injection_STN
    chrimsonR_PPN:
      name: chrimsonR_PPN
      description: ChrimsonR opsin used for optogenetic stimulation injected into the PPN.
      manufacturer: Addgene
      label: ChrimsonR-tdTomato
      viral_vector_injection_metadata_key: viral_vector_injection_PPN
  OptogeneticSitesTable:
    name: optogenetic_sites_table
    description: Information about each optogenetic site, including the excitation source, the optical fiber that
      delivered the light to the input's terminals in SN, and the targeted effector.
    rows:
