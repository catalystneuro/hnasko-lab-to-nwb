# Devices that differ between the recording rigs, from the lab's hardware list. Keys are the rig names of the
# session config; the entries of a session's rig update the shared devices (devices_metadata.yaml).
RZ5P:
  DeviceModels:
    excitation_source_model_calcium:
      manufacturer: Doric Lenses
    excitation_source_model_isosbestic:
