# Metadata for Hadjas 2025 --> Parkinson's resilient Vglut2+ dopamine subtypes recordings, STN & PPN stim
NWBFile:
  keywords: [SNc fiber photometry recordings, Vglut2+ dopamine subtypes, VGLUT2-Cre x DAT-Flp, STN optogenetic stimulation,
    PPN optogenetic stimulation, Parkinson's disease]
  experiment_description: Parkinson's resilient Vglut2+ dopamine subtypes recordings. Mice were freely moving on a plastic
    tub. Simultaneous passive optogenetic stimulation and fiber photometry recordings were conducted during the first two
    days. Excitatory inputs from either the STN or PPN to SN were stimulated. Recordings of GCaMP6f fluorescence signal captured
    Vglut2+ DA neurons activity in SNc in VGLUT2-Cre x DAT-Flp mice.
  surgery: Mice > 6 weeks old were anesthetized with isofluorane (4% for induction and 1-2% for maintenance), and provided
    with pre- and post-surgical analgesic carprofen (5 mg/kg i.p). For recording from Vglut2+ DA neurons in SNc, VGLUT2-Cre
    x DAT-Flp animals were injected with 300 nl of AAV8-Ef1a-ConFon-GCaMP6f (2.3e12 vg/ml, Addgene 137122) in SNc (AP -3.20,
    ML +/-1.5, DV -4.20), and AAV5-Syn-FLEX-ChrimsonR-TdTomato was injected in STN or PPN as above. A fiber (400-um core,
    0.39 NA, L = 6 mm, 1.25 mm black ceramic ferrule, RWD) was implanted in SNc (AP -3.20, ML +/-1.60, DV -4.00).
