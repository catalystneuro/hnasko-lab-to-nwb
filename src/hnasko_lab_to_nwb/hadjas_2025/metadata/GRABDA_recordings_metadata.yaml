# Metadata for Hadjas 2025 --> 3. Striatal GRAB_DA recordings (DLS & TS), STN & PPN stim
NWBFile:
  keywords: [DLS fiber photometry recordings, TS fiber photometry recordings, Dopamine release, VGLUT2-Cre, STN optogenetic
      stimulation, PPN optogenetic stimulation, Parkinson's disease]
  experiment_description: Striatal dopamine release in dorsolateral and tail striatum recordings. Mice were freely moving
    on a plastic tub. Simultaneous passive optogenetic stimulation and fiber photometry recordings were conducted during the
    first two days. Excitatory inputs from either the STN or PPN to SN were stimulated and the DA release in striatal subregions
    (DLS or TS) in VGLUT2-Cre mice were recorded.
  surgery: Mice > 6 weeks old were anesthetized with isoflurane (4% for induction; 1-2% for maintenance). For monitoring DA
    release in striatal subregions (DLS and TS) in VGLUT2-Cre mice were injected with 300 nl of AAV9-EF1a-GRABDA2m (2e12 vg/mL,
    Addgene 140553) in either DLS (AP +0.5, ML +/-2.25, DV -2.95) or TS (AP -1.25, ML +/-2.9, DV -3.45). A fiber (400-um core,
    0.39 NA, L = 4 mm, 1.25-mm black ceramic ferrule, RWD) was implanted in either DLS (AP +0.5, ML +/- 2.25, DV -2.75) or
    TS (AP -1.25, ML +/2.9, DV -3.25). For optogenetic stimulation, 150-200 nl of AAV5-Syn-FLEX-ChrimsonR-tdTomato (4 - 8.5e12
    vg/ml, Addgene 62723) was injected in either STN (AP -2.00, ML +/-1.6, DV -4.5) or PPN (AP -4.48, ML +/- 1.1, DV -3.75).
    Mice were allowed to recover for 4 weeks before starting experiments.
