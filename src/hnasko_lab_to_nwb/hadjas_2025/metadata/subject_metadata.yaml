Subject:
  species: Mus musculus
  description: All mouse experiments were performed in accordance with protocols approved by UCSD Institutional Animal Care
    and Use Committee. Male and female mice were bred at UCSD and group-housed on a 12-hour light/dark cycle, with food and
    water ad libitum. VGLUT2-Cre (Slc17a6tm2(cre)Lowl, RRID:IMSR_JAX:016963) and VGAT-Flp (Slc32a1tm1.1(flpo)Hze, RRID:IMSR_JAX:029591)
    mice were obtained from the Jackson Laboratory and maintained backcrossed on to C57BL/6J (RRID:IMSR_JAX:000664). The DAT-Flp
    (Slc6a3em1(flpo)Hbat, RRID:IMSR_JAX:035436) were generously provided by Dr. Helen Bateup (UC Berkeley). VGLUT2-PhiC31
    (Jeong et al. 2024) mice were generously provided by Dr. Lim (UC San Diego). DAT-Flp (Slc6a3em1(flpo)NW Jax and RRID)
    and Anxa1-Cre (RRID:MMRRC_069931-MU) were generously provided by Dr.Awatramani (Northwestern).
  age: P6W
  strain: C57BL/6J
