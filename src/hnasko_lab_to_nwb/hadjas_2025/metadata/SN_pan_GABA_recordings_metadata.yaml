# Metadata for Hadjas 2025 --> SNr pan-GABA GCaMP6f recordings, STN & PPN stim
NWBFile:
  keywords: [SNc fiber photometry recordings, SNr GABAergic neurons, VGLUT2-Cre x VGAT-Flp, STN optogenetic stimulation, PPN
      optogenetic stimulation, Parkinson's disease]
  experiment_description: SNr GABAergic neurons recordings. Mice were freely moving on a plastic tub. Simultaneous passive
    optogenetic stimulation and fiber photometry recordings were conducted during the first two days. Excitatory inputs from
    either the STN or PPN to SN were stimulated. Recordings of GCaMP6f fluorescence signal captured pan-GABA activity in the
    SNr in VGLUT2-Cre x VGAT-Flp mice.
  surgery: Mice > 6 weeks old were anesthetized with isofluorane (4% for induction and 1-2% for maintenance), and provided
    with pre- and post-surgical analgesic carprofen (5 mg/kg i.p). For calcium recordings in VGLUT2-Cre x VGAT-Flp mice were
    injected with 300 nl of AAV1-Ef1a-fDIO-GCaMP6f (4e12 vg/mL, Addgene 1283125) in SNr (AP -3.3, ML +/-1.3, DV -4.6). A fiber
    (400-um core, 0.39 NA, 6-mm length, 1.25-mm diameter black ceramic ferrule, RWD) was implanted in SNr (AP -3.3, ML +/-1.4,
    DV -4.4). For optogenetic stimulation, 150-200 nl of AAV5-Syn-FLEX-ChrimsonR-tdTomato (4 - 8.5e12 vg/ml, Addgene 62723)
    was injected in either STN (AP -2.00, ML +/-1.6, DV -4.5) or PPN (AP -4.48, ML +/- 1.1, DV -3.75).
