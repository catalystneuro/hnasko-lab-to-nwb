# Metadata shared by all Hadjas 2025 cohorts. Cohort files add to or override these values; each cohort file
# describes its own mouse lines, and the devices that differ between recording rigs are in the rigs section of
# session_config.yaml.
NWBFile:
  related_publications: ['doi:10.1101/2025.06.03.657460']  # Hadjas et al. 2025, bioRxiv preprint
  institution: UC San Diego School of Medicine
  lab: Hnasko
  experimenter: ['Hadjas, Lotfi', 'Hollon, Nick']
Subject:
  species: Mus musculus
  age: P6W/  # older than 6 weeks at surgery (ISO 8601 interval with no upper bound)
  strain: C57BL/6J
DeviceModels:
  excitation_source_model_calcium:
    type: ExcitationSourceModel
    name: excitation_source_model_calcium
    source_type: LED
    excitation_mode: one-photon
    wavelength_range_in_nm: [460.0, 490.0]
  excitation_source_model_isosbestic:
    type: ExcitationSourceModel
    name: excitation_source_model_isosbestic
    source_type: LED
    excitation_mode: one-photon
  photodetector_model:
    type: PhotodetectorModel
    name: photodetector_model
    detector_type: photodiode
  emission_filter_model:
    type: BandOpticalFilterModel
    name: emission_filter_model
    description: Part of the 5-port fluorescence mini cube (Doric Lenses) that filters and combines the excitation light and separates
      the emitted fluorescence.
    manufacturer: Doric Lenses
    filter_type: Bandpass
    center_wavelength_in_nm: 520.0
    bandwidth_in_nm: 40.0
  excitation_filter_model:
    type: BandOpticalFilterModel
    name: excitation_filter_model
    description: Part of the 5-port fluorescence mini cube (Doric Lenses) that filters and combines the excitation light and separates
      the emitted fluorescence.
    manufacturer: Doric Lenses
    filter_type: Bandpass
    center_wavelength_in_nm: 445.0
    bandwidth_in_nm: 90.0
  dichroic_mirror_model:
    type: DichroicMirrorModel
    name: dichroic_mirror_model
    description: Part of the 5-port fluorescence mini cube (Doric Lenses) that filters and combines the excitation light and separates
      the emitted fluorescence.
    manufacturer: Doric Lenses
  optogenetic_excitation_source_model:
    type: ExcitationSourceModel
    name: optogenetic_excitation_source_model
    description: 635 nm red laser used for optogenetic stimulation.
    manufacturer: Shanghai Laser
    model_number: RLM635TA-150FC
    source_type: laser
    excitation_mode: one-photon
Devices:
  excitation_source_calcium_signal:
    type: ExcitationSource
    name: excitation_source_calcium_signal
    device_model_metadata_key: excitation_source_model_calcium
  excitation_source_isosbestic_control:
    type: ExcitationSource
    name: excitation_source_isosbestic_control
    device_model_metadata_key: excitation_source_model_isosbestic
  photodetector:
    type: Photodetector
    name: photodetector
    description: Photodetector that records the fluorescence collected by the fiber (raw Fi1r signal).
    device_model_metadata_key: photodetector_model
  emission_filter:
    type: BandOpticalFilter
    name: emission_filter
    description: Emission filter of the fluorescence mini cube.
    device_model_metadata_key: emission_filter_model
  excitation_filter:
    type: BandOpticalFilter
    name: excitation_filter
    description: Excitation filter of the fluorescence mini cube.
    device_model_metadata_key: excitation_filter_model
  dichroic_mirror:
    type: DichroicMirror
    name: dichroic_mirror
    description: Dichroic mirror of the fluorescence mini cube.
    device_model_metadata_key: dichroic_mirror_model
  optogenetic_excitation_source:
    type: ExcitationSource
    name: optogenetic_excitation_source
    description: Red laser that delivered the optogenetic stimulation trains.
    device_model_metadata_key: optogenetic_excitation_source_model
# Sentences shared by the cohorts, filled in by hadjas_2025/cohort_metadata.py and removed from the metadata before
# conversion. Placeholders in braces: {label} is the sensor (e.g. GCaMP6f), {sensor_type} calcium or dopamine,
# {site} the recording site (e.g. SNc), {location} its full name, {isosbestic} the isosbestic wavelength in nm.
TextTemplates:
  # Fiber photometry, one per recording site
  excitation_source_model_calcium: excitation source for the {label} sensor's fluorescence signal.
  excitation_source_model_isosbestic: excitation source for the {label} sensor's isosbestic control.
  excitation_source_calcium_signal: excitation source for the {label} sensor's fluorescence signal (465nm).
  excitation_source_isosbestic_control: excitation source for the {label} sensor's isosbestic control ({isosbestic}nm).
  optical_fiber: Chronically implanted optic fiber.
  fiber_photometry_injection: Viral injection of {label} in {site}.
  indicator: '{label} {sensor_type} sensor in {target}.'
  raw_signal: Raw photodetector signal of the {location} fiber (TDT Fi1r store). It carries the {label}
    fluorescence excited by the 465 nm and {isosbestic} nm LEDs, each modulated at its own frequency (see the
    excitation sources); the processed series in the ophys module are demodulated from it.
  demodulated_calcium_signal: '{label} fluorescence in the {location} excited at 465 nm (the sensor), computed by the
    lab with custom MATLAB code, which demodulated it from the raw signal and lowpass filtered at 6 Hz with a
    zero-phase filter, at the sampling rate of the raw signal.'
  demodulated_isosbestic_control: '{label} fluorescence in the {location} excited at {isosbestic} nm (the isosbestic
    control), computed by the lab with custom MATLAB code, which demodulated it from the raw signal and lowpass
    filtered at 6 Hz with a zero-phase filter, at the sampling rate of the raw signal.'
  downsampled_calcium_signal: '{label} fluorescence in the {location} excited at 465 nm (the sensor), computed by the
    lab with custom MATLAB code, which demodulated it, lowpass filtered it at 6 Hz with a zero-phase filter and
    downsampled to 100 Hz.'
  downsampled_isosbestic_control: '{label} fluorescence in the {location} excited at {isosbestic} nm (the isosbestic
    control), computed by the lab with custom MATLAB code, which demodulated it, lowpass filtered it at 6 Hz with a
    zero-phase filter and downsampled to 100 Hz.'
  deltaF_over_F: dF/F of the {label} signal in the {location}, in percent, computed by the lab with custom MATLAB
    code. A biexponential curve was fit to the 100 Hz isosbestic signal and scaled to the 100 Hz 465 nm signal by
    robust linear regression; dF/F = 100 * (465 nm signal - scaled fit) / scaled fit.
  raw_signal_region: The region of the FiberPhotometryTable corresponding to the raw signal of {site}.
  calcium_signal_region: The region of the FiberPhotometryTable corresponding to the calcium signal of {site}.
  isosbestic_control_region: The region of the FiberPhotometryTable corresponding to the isosbestic control of {site}.
  deltaF_over_F_region: The region of the FiberPhotometryTable corresponding to the deltaF/F signal of {site}.
