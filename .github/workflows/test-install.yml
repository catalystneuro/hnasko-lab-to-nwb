name: Installation
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"  # First day of the month

jobs:
  run:
    name: Installation on (${{ matrix.os }} with Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - run: git fetch --prune --unshallow --tags
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pip
      run: |
        python -m pip install --upgrade pip
        pip3 install packaging
    - name: Install package
      run: pip install -e .
    - name: Test module load
      run: |
        python -c "import hnasko_lab_to_nwb"
        python -c "import hnasko_lab_to_nwb.hadjas_2025.convert_all_sessions"
        python -c "import hnasko_lab_to_nwb.hadjas_2025.utils.check_sessions_on_dandi"
